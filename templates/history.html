<!DOCTYPE html>

<html>

<head>

<title>
Scan History
</title>


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">


</head>


<body class="bg-dark text-white">


<div class="container mt-4">


<h1>
Scan History
</h1>



<table class="table table-dark">


<tr>

<th>
File
</th>

<th>
Hash
</th>

<th>
Antivirus
</th>

<th>
Risk
</th>

</tr>



{% for scan in scans %}


<tr>

<td>
{{scan.filename}}
</td>


<td>
{{scan.file_hash[:20]}}...
</td>


<td>
{{scan.antivirus}}
</td>


<td>
{{scan.risk_level}}
</td>


</tr>


{% endfor %}



</table>


<a href="/" class="btn btn-primary">

Home

</a>


</div>


</body>


</html>
