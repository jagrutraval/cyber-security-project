<!DOCTYPE html>
<html>
<head>
    <title>Login - Malware Analyzer</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:#0f172a;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .login-card{
            width:450px;
            border:none;
            border-radius:20px;
            box-shadow:0 0 25px rgba(0,0,0,0.3);
        }

        .logo{
            font-size:50px;
        }
    </style>
</head>

<body>

<div class="card login-card p-4">

    <div class="text-center mb-3">
        <div class="logo">🛡️</div>
        <h2>Malware Analyzer</h2>
        <p class="text-muted">
            Secure Login Portal
        </p>
    </div>

    <form method="post">

        <div class="mb-3">
            <label class="form-label">
                Username
            </label>

            <input
                type="text"
                name="username"
                class="form-control"
                required
            >
        </div>

        <div class="mb-3">
            <label class="form-label">
                Password
            </label>

            <input
                type="password"
                name="password"
                class="form-control"
                required
            >
        </div>

        <button
            type="submit"
            class="btn btn-success w-100"
        >
            Login
        </button>

    </form>

    <hr>

    <div class="text-center">

        <p>
            Don't have an account?
        </p>

        <a href="/register" class="btn btn-outline-primary">
            Register
        </a>

    </div>

</div>

</body>
</html>
