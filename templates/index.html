<!DOCTYPE html>

<html>

<head>

<title>
AI Malware Analyzer
</title>


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">


</head>


<body class="bg-dark text-white">


<nav class="navbar navbar-dark bg-black">

<div class="container">

<span class="navbar-brand">
🛡 Malware Analyzer
</span>


<a href="/history" class="btn btn-outline-light">
Scan History
</a>


</div>

</nav>



<div class="container mt-5">


<div class="card bg-secondary p-5">


<h1 class="text-center">
AI Malware Analysis Platform
</h1>


<p class="text-center">
Upload a file and analyze security threats
</p>



<form 
action="/upload"
method="post"
enctype="multipart/form-data">


<input
class="form-control"
type="file"
name="file"
required>


<br>


<button class="btn btn-danger w-100">

Start Security Scan

</button>


</form>


</div>


</div>


</body>


</html>
